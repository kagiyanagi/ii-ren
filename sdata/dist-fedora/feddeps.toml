# COPR repositories list
# "solopasha/hyprland" is not up to date to the current Hyprland version, replaced with the fork "sdegler/hyprland"
# ii-ren reads its Hyprland config as Lua, which needs Hyprland 0.56 or later: sdegler/hyprland has it for Fedora 43+.
[copr]
repos = [
  "ririko66z/dots-hyprland",
  "sdegler/hyprland",
  "deltacopy/darkly",
  "alternateved/eza",
  "atim/starship"
]

# Fedora dependencies list, kept in step with sdata/dist-arch.

# Audio
[groups.audio]
packages = [
  "cava",
  "pavucontrol-qt",
  "wireplumber",
  "pipewire-pulseaudio",
  "libdbusmenu-gtk3-devel",
  "playerctl"
]

# Backlight
[groups.backlight]
packages = [
  "geoclue2",
  "brightnessctl",
  "ddcutil"
]
install_opts = ["--setopt=install_weak_deps=False"]

# Basic
[groups.basic]
packages = [
  "bc",
  "coreutils",
  "cliphist",
  "cmake",
  "curl",
  "wget",
  "ripgrep",
  "jq",
  "xdg-utils",
  "xdg-user-dirs",
  "bluez",
  "libnotify",
  "lua",
  "python3",
  "rsync",
  "yq"
]

# Building the hyprbars plugin for floating mode's title bars (scripts/hyprland/hyprbars.sh)
[groups.hyprbars]
packages = [
  "gcc-c++",
  "make",
  "patch",
  "git",
  "pkgconf-pkg-config",
  "hyprland-devel"
]
install_opts = ["--setopt=install_weak_deps=False"]

# Cursor themes
[groups.cursor_themes]
packages = [
  "bibata-cursor-theme"
]

# Fonts & Themes
[groups.fonts_and_themes]
packages = [
  "adw-gtk3-theme",
  "breeze-cursor-theme",
  "breeze-icon-theme",
  "breeze-icon-theme-fedora",
  "kf6-breeze-icons",
  "breeze-plus-icon-theme",
  "darkly",
  "eza",
  "fish",
  "fontconfig",
  "kitty",
  "florian-karsten-space-grotesk-fonts",
  "starship",
  "jetbrains-mono-nerd-fonts",
  "google-material-symbols-vf-rounded-fonts",
  "material-icons-fonts",
  "readex-pro-fonts-all",
  "google-rubik-vf-fonts",
  "twitter-twemoji-fonts",
  "google-sans-flex-vf-fonts"
]

# Hyprland
[groups.hyprland]
packages = [
  "hyprland",
  "hyprland-guiutils",
  "hyprland-qt-support",
  "hyprsunset",
  "wl-clipboard"
]
install_opts = ["--setopt=install_weak_deps=False"]

# KDE
[groups.kde]
packages = [
  "bluedevil",
  "gnome-keyring",
  "NetworkManager",
  "iw",
  "plasma-nm",
  "plasma-integration",
  "polkit-kde",
  "dolphin",
  "plasma-systemsettings"
]

# MicroTeX-git
[groups.microtex]
packages = [
  "microtex"
]

# Portal
[groups.portal]
packages = [
  "xdg-desktop-portal",
  "xdg-desktop-portal-gtk",
  "xdg-desktop-portal-kde",
  "xdg-desktop-portal-hyprland"
]

# Python
[groups.python]
packages = [
  "clang",
  "uv",
  "gtk4-devel",
  "libadwaita-devel",
  "libsoup3-devel",
  "libportal-gtk4",
  "gobject-introspection-devel",
  "python3",
  "python3.12",
  "python3-devel",
  "python3.12-devel"
]
install_opts = ["--setopt=install_weak_deps=False"]

[groups.illogical-impulse]
packages = [
    "quickshell-git",
    "matugen"
]

# The Qt modules the shell imports (the quickshell-git package itself only needs Qt's core)
[groups.qt]
packages = [
  "qt6-qt5compat",
  "qt6-qtimageformats",
  "kf6-kimageformats",
  "qt6-qtmultimedia",
  "qt6-qtpositioning",
