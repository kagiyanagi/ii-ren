# Themed by ii: slots 232-255 are overridden with the wallpaper's Material
# scheme (scripts/colors/terminal/kitty-theme.conf), so the prompt recolours
# with the shell. Shows what end-4's prompt shows, nothing more.
#   255 primary   254/233 primaryContainer/on   252/235 secondaryContainer/on
#   250/237 tertiaryContainer/on   249 error   245 outlineVariant
add_newline = false
format = """
[╭─](fg:245) $directory$git_branch
[╰─](fg:245)$character"""
right_format = "$cmd_duration"

[character]
success_symbol = "[❯](bold fg:255)"
error_symbol = "[❯](bold fg:249)"
vimcmd_symbol = "[❮](bold fg:255)"

[directory]
style = "bg:254 fg:233"
home_symbol = "\uf015"
read_only = " \U000f033e"
read_only_style = "bg:254 fg:233"
truncation_length = 2
truncation_symbol = "…/"
format = "[](fg:254)[\U000f024b $path[$read_only]($read_only_style)](bg:254 fg:233)[](fg:254)"

[directory.substitutions]
"Code" = "\uf121"
"GitHub" = "\U000f02a4"
"Desktop" = "\uf108"
"Documents" = "\U000f0219"
"Downloads" = "\uf019"
"Music" = "\U000f0388"
"Pictures" = "\uf03e"
"Videos" = "\uf03d"

[git_branch]
symbol = "\ue725"
truncation_length = 24
truncation_symbol = "…"
format = " [](fg:252)[$symbol $branch(:$remote_branch)](bg:252 fg:235)[](fg:252)"

[cmd_duration]
min_time = 0
format = "[](fg:250)[\U000f051b $duration](bg:250 fg:237)[](fg:250)"
