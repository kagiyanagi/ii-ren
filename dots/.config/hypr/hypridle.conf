# Ask the shell to lock; if it isn't answering, fall back to hyprlock. Both checks are
# per-user on purpose: `qs ipc` only finds this user's instances, and pidof matches every
# account's processes, so another user's running shell or hyprlock would skip the lock.
$lock_cmd = hyprctl dispatch 'hl.dsp.global("quickshell:lock")' & qs -c ${qsConfig:-ii} ipc call TEST_ALIVE || pgrep -xu "$USER" hyprlock || hyprlock
# $lock_cmd = pgrep -xu "$USER" hyprlock || hyprlock
$suspend_cmd = systemctl suspend || loginctl suspend

general {
    lock_cmd = $lock_cmd
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms("on")'; hyprctl dispatch 'hl.dsp.global("quickshell:lockFocus")'
    inhibit_sleep = 3
}

listener {
    timeout = 300 # 5mins
    on-timeout = loginctl lock-session
}

listener {
    timeout = 600 # 10mins
    on-timeout = hyprctl dispatch 'hl.dsp.dpms("off")'
    on-resume = hyprctl dispatch 'hl.dsp.dpms("on")'
}

listener {
    timeout = 900 # 15mins
    on-timeout = $suspend_cmd
}
